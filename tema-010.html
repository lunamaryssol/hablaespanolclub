<script>const slides=[{"section":"TEMA 010","title":"¿Tener más opciones nos hace más felices?","kind":"cover","sub":"Elegir, comparar y decidir sin quedarnos atrapados."},{"section":"ACTIVIDAD 01 · CONSIGNA","title":"El menú que no se acaba","kind":"instruction","body":"Verás dos cartas de postres. Elige uno y explica qué criterio utilizaste.","foot":"Después compara cuál de los dos menús te resulta más cómodo."},{"section":"ACTIVIDAD 01 · OBSERVA","title":"¿Qué postre eliges?","kind":"columns","columns":[{"head":"MENÚ A · 4 OPCIONES","lines":["Flan de caramelo","Tarta de limón","Helado de vainilla","Brownie"]},{"head":"MENÚ B · 12 OPCIONES","lines":["Tiramisú · Cheesecake · Mousse","Helado de mango · Sorbete de maracuyá","Milhojas · Panna cotta · Tarta de manzana","Helado de pistacho · Brownie con sal marina","Helado de ajo · Tarta de aceitunas"]}],"foot":"Elige primero; compara después."},{"section":"ACTIVIDAD 01 · CONVERSA","title":"¿Más opciones ayudan a elegir?","kind":"question","body":"¿Te ayuda ver más opciones o te cuesta renunciar a las que no eliges?","foot":"B1: Me quedo con… porque…  ·  B2: Aunque hay más variedad, me inclino por…"},{"section":"ACTIVIDAD 02 · CONSIGNA","title":"Seis fichas para el sábado","kind":"rules","body":"Presupuesto: 6 fichas. Hay 8 actividades disponibles. Elijan exactamente 3 sin gastar más de 6 fichas.","criteria":["Respetar el presupuesto","Incluir aire libre","Incluir descanso","Incluir un plan social","Justificar una renuncia"],"foot":"Cada criterio cumplido da 1 punto. Gana el equipo con más puntos."},{"section":"ACTIVIDAD 02 · JUEGO INTERACTIVO","title":"Elige tres actividades","kind":"game","body":"Selecciona las actividades en el juego. Los criterios se marcan automáticamente, se descuentan las fichas y se calcula la puntuación.","url":"https://lunamaryssol.github.io/hablaespanolclub/juego-seis-fichas.html","foot":"B1: Propongo… / Nos alcanza para…  ·  B2: Si priorizamos…, renunciamos a…"},{"section":"ACTIVIDAD 03 · CONSIGNA","title":"¿Más opciones, más libertad?","kind":"instruction","body":"Para cada afirmación, elige una postura: de acuerdo, depende o en desacuerdo.","foot":"Defiende tu postura. Escucha una objeción y decide si cambiarías de opinión."},{"section":"ACTIVIDAD 03 · AFIRMACIÓN 1","title":"¿Más opciones, más libertad?","kind":"focus","body":"Cuantas más opciones tengo,\nmás libre me siento.","foot":"¿Estás de acuerdo, depende o estás en desacuerdo?"},{"section":"ACTIVIDAD 03 · AFIRMACIÓN 2","title":"¿Más opciones, más libertad?","kind":"focus","body":"Comparar alternativas siempre\nmejora mis decisiones.","foot":"Defiende tu postura con un ejemplo."},{"section":"ACTIVIDAD 03 · AFIRMACIÓN 3","title":"¿Más opciones, más libertad?","kind":"focus","body":"Prefiero que alguien reduzca\nlas opciones por mí.","foot":"¿En qué circunstancias ocurriría?"},{"section":"ACTIVIDAD 03 · AFIRMACIÓN 4","title":"¿Más opciones, más libertad?","kind":"focus","body":"A veces elegir rápido\nme hace más feliz.","foot":"¿Puedes pensar en un contraejemplo?"},{"section":"ACTIVIDAD 03 · CIERRE","title":"¿Cambiaste de opinión?","kind":"question","body":"¿Qué argumento de otra persona te hizo reconsiderar una afirmación?","foot":"B1: En mi caso…  ·  B2: No necesariamente… / Cambiaría de opinión si…"},{"section":"ACTIVIDAD 04 · INTRODUCCIÓN","title":"El experimento de las mermeladas","kind":"instruction","body":"Leeremos un experimento sobre dos mesas de degustación: una con 24 variedades y otra con 6.","foot":"Después separaremos los resultados observados de las conclusiones exageradas."},{"section":"ACTIVIDAD 04 · LECTURA","title":"¿Qué observaron?","kind":"reading","body":"En un supermercado, unos investigadores organizaron una degustación de mermeladas. En una ocasión ofrecieron 24 variedades y, en otra, 6.\n\nLa mesa con más opciones atrajo a más personas. Sin embargo, quienes encontraron la selección pequeña tuvieron más probabilidades de comprar.","foot":"Iyengar y Lepper (2000) · When Choice Is Demotivating"},{"section":"ACTIVIDAD 04 · INTERPRETA","title":"¿Qué podemos concluir?","kind":"reading","body":"El experimento no demuestra que pocas opciones sean siempre mejores.\n\nLa dificultad para elegir puede depender de cuánto se parecen las alternativas, de la importancia de la decisión y de si sabemos qué buscamos.","foot":"¿Qué otras explicaciones podrían existir?"},{"section":"ACTIVIDAD 04 · CLASIFICA","title":"¿Resultado o conclusión?","kind":"statements","items":["A. La mesa con 24 variedades atrajo más visitantes.","B. La selección de 6 tuvo más compras por visitante que probó."],"foot":"¿Qué afirma el texto? ¿Qué datos necesitarías para comprobarlo?"},{"section":"ACTIVIDAD 04 · CLASIFICA","title":"¿Resultado o conclusión?","kind":"statements","items":["C. Todas las personas son más felices con menos opciones.","D. No se puede afirmar que pocas opciones sean siempre mejores."],"foot":"¿Cuál de estas afirmaciones generaliza demasiado? ¿Por qué?"},{"section":"ACTIVIDAD 04 · CONVERSA","title":"¿Atraer es lo mismo que elegir?","kind":"question","body":"¿Por qué una mesa con más variedades puede atraer a más personas y generar menos compras?","foot":"B1: El texto muestra que…  ·  B2: El resultado no demuestra que…"},{"section":"ACTIVIDAD 05 · ANTES DEL SHORT","title":"¿Te cuesta tomar decisiones?","kind":"instruction","body":"Antes: piensa en una decisión cotidiana que sueles aplazar.\n\nMientras lo ves: identifica la metáfora que utiliza el autor y la idea principal.","foot":"Después relacionaremos el contenido con nuestras decisiones."},{"section":"ACTIVIDAD 05 · SHORT","title":"¿Te cuesta tomar decisiones?","kind":"video","channel":"Píldoras de Psicología","url":"https://www.youtube.com/shorts/01QEkvw_MrI"},{"section":"ACTIVIDAD 05 · DESPUÉS DEL SHORT","title":"¿Qué significa la metáfora?","kind":"question","body":"¿Qué representa la metáfora? ¿Qué relación tiene con elegir entre alternativas? ¿Te parece útil?","foot":"B1: La idea principal es…  ·  B2: La comparación funciona porque…"},{"section":"ACTIVIDAD 06 · PRIMERA DECISIÓN","title":"La película que nunca empieza","kind":"columns","columns":[{"head":"OPCIONES A Y B","lines":["A · Risas en el ascensor","Comedia · 95 min","B · La última pista","Misterio · 110 min"]},{"head":"OPCIÓN C","lines":["C · El mapa perdido","Aventura · 85 min","Todas con audio en español"]}],"foot":"Elige una y explica qué criterio utilizaste.","reveal":{"title":"Nueva información","body":"El último transporte sale dentro de 90 minutos. Las películas A y B ya no caben en el tiempo disponible.\n\nLa opción C sí, pero una persona del grupo ya la vio y preferiría descubrir una historia nueva.","hint":"¿Conservas la película elegida o cambias de plan?"}},{"section":"ACTIVIDAD 06 · NUEVA INFORMACIÓN","title":"¡Cambian las condiciones!","kind":"focus","body":"El último transporte sale\ndentro de 90 minutos.","foot":"A y B ya no caben. C sí, pero alguien ya la vio y prefiere una historia nueva."},{"section":"ACTIVIDAD 06 · DECIDE","title":"¿Mantienes tu elección?","kind":"question","body":"¿Repiten la película, cambian de plan o proponen otra alternativa?","foot":"B1: Al principio elegí…, pero ahora…  ·  B2: El criterio que pesa más es…"},{"section":"ACTIVIDAD 07 · ANTES DEL SHORT","title":"La felicidad y nuestra actitud","kind":"instruction","body":"Escucharás un fragmento musical de «Color esperanza», de Diego Torres.\n\nIdentifica qué actitud hacia la vida transmite.","foot":"Piensa cómo puede relacionarse con las decisiones personales."},{"section":"ACTIVIDAD 07 · SHORT MUSICAL","title":"Escucha «Color esperanza»","kind":"video","channel":"Interpretación breve · La Voz Global","url":"https://www.youtube.com/shorts/Q-uUOmHlGVI"},{"section":"ACTIVIDAD 07 · INTERPRETA","title":"¿Qué idea transmite?","kind":"statements","items":["A. Todo depende de tener muchas opciones.","B. La esperanza ayuda a mirar el futuro de otra manera.","C. Nunca debemos cambiar de opinión."],"foot":"¿Cómo influye la actitud? ¿Y las circunstancias externas?"},{"section":"ACTIVIDAD 08 · ANTES DEL SHORT","title":"Antes de elegir, enciende el semáforo","kind":"instruction","body":"Verás una técnica para detenerte, pensar y actuar antes de decidir.","foot":"Mientras ves el Short, identifica qué representa cada color."},{"section":"ACTIVIDAD 08 · SHORT","title":"La técnica del semáforo","kind":"video","channel":"Mayores@Resilientes","url":"https://www.youtube.com/shorts/rrW5gejXCUs"},{"section":"ACTIVIDAD 08 · ELIGE","title":"¿Qué harías el sábado?","kind":"statements","items":["A · Parque: gratis y tranquilo.","B · Cine: coste medio y horario fijo.","C · Festival: más caro, muchas actividades."],"foot":"Aplica los tres pasos del semáforo a estas opciones.","reveal":{"title":"Nueva información","body":"El pronóstico anuncia lluvia durante la tarde y la persona que te acompaña solo tiene dos horas libres.\n\n¿Mantienes tu plan inicial o cambias de opción? Explica tu decisión.","hint":"Ahora vuelve a aplicar el semáforo: detente, piensa y actúa."}},{"section":"ACTIVIDAD 08 · PASO 1","title":"Rojo: detente","kind":"focus","body":"¿Qué decisión\nnecesitas tomar?","foot":"Define la situación antes de actuar."},{"section":"ACTIVIDAD 08 · PASO 2","title":"Amarillo: piensa","kind":"focus","body":"¿Qué criterios\nimportan más?","foot":"Presupuesto, tiempo, compañía, ganas…"},{"section":"ACTIVIDAD 08 · PASO 3","title":"Verde: actúa","kind":"focus","body":"Elige una opción\ny justifica tu decisión.","foot":"B1: Primero… / Después…  ·  B2: El criterio decisivo para mí sería…"},{"section":"ACTIVIDAD 09 · ESCRIBE","title":"Tu regla para elegir","kind":"instruction","body":"Un amigo lleva días comparando 12 destinos para sus vacaciones y no consigue reservar.\n\nEscríbele un mensaje de 4–6 frases con un consejo.","foot":"Incluye dos criterios, una ventaja, una renuncia y una conclusión."},{"section":"ACTIVIDAD 09 · COMPARTE","title":"Defiende tu consejo","kind":"question","body":"Lee tu mensaje. ¿Por qué tu recomendación puede ayudar? ¿Qué otros consejos te convencen?","foot":"B1: Te recomiendo…  ·  B2: Aunque…, me inclino por…"},{"section":"ACTIVIDAD 09 · CIERRE","title":"¿Qué te llevas de hoy?","kind":"focus","body":"¿Comparar más,\ndefinir mejor tus criterios\no aprender a renunciar?","foot":"Cuantas más opciones… · Por una parte… · Sin embargo… · Me inclino por…"}];

return '<svg class="scribbles" viewBox="0 0 1440 810" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(1280,60) scale(.58)">'+d+'</g><g transform="translate(18,390) scale(.42)">'+d2+'</g><g transform="translate(1260,550) scale(.36)">'+variants[(i+3)%variants.length]+'</g></svg>';}

function inner(s){
 switch(s.kind){
 case 'cover':return '<div class="start"><div class="focus">'+lines(s.title)+'</div><p class="hint">'+esc(s.sub)+'</p></div>';

document.getElementById('prev').onclick=()=>render(index-1);
document.getElementById('next').onclick=()=>render(index+1);
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
const overview=document.getElementById('overview');
document.querySelector('.close-overview').onclick=()=>overview.classList.remove('open');
const grid=document.getElementById('overview-grid');
grid.innerHTML=slides.map((s,i)=>'<button data-i="'+i+'"><b>'+(i+1)+'. '+esc(s.section)+'</b><p>'+esc(s.title)+'</p></button>').join('');
grid.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){render(+b.dataset.i);overview.classList.remove('open')}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){if(e.target.tagName==='BUTTON'||e.target.tagName==='A')return;e.preventDefault();render(index+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();render(index-1)}else if(e.key.toLowerCase()==='o'){overview.classList.toggle('open')}else if(e.key==='Escape')overview.classList.remove('open')});
render(Math.max(0,(Number(location.hash.slice(1))||1)-1));
</script></body></html>
