const MONTHS=[...new Set(EVENTS.map(e=>e.fecha.slice(0,7)))].sort();
const CATS=['Todos','Trabajo y Negocios','Personas y relaciones','Cultura y mundo','Opiniones y debates','Conversación libre'];
const tparts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Bogota',day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date());
const today={};tparts.forEach(p=>today[p.type]=p.value);
const TODAY=today.year+'-'+today.month+'-'+today.day;
// En celulares se prioriza el día local del estudiante; en escritorio se conserva el comportamiento original.
const localNow=new Date();
const MOBILE_TODAY=localNow.getFullYear()+'-'+String(localNow.getMonth()+1).padStart(2,'0')+'-'+String(localNow.getDate()).padStart(2,'0');
const DISPLAY_TODAY=window.matchMedia('(max-width:620px)').matches?MOBILE_TODAY:TODAY;
let activeMonth=MONTHS.includes(DISPLAY_TODAY.slice(0,7))?DISPLAY_TODAY.slice(0,7):MONTHS[0];
let activeCategory='Todos';
const el=id=>document.getElementById(id);
const format=(iso,options={})=>new Intl.DateTimeFormat('es-CO',{timeZone:'UTC',...options}).format(new Date(iso+'T12:00:00Z'));
const norm=s=>String(s||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function matches(e){return activeCategory==='Todos'||e.pilar===activeCategory}
function openDetail(e){el('detail-date').textContent=format(e.fecha,{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(e.pilar?' · '+e.pilar:'');el('detail-title').textContent=e.titulo;const content=el('detail-sections');content.replaceChildren();let parts=e.tipo==='sesion'?[['Enfoque comunicativo y pedagógico',e.enfoque],['Herramientas lingüísticas',e.herramientas]]:[['Información de esta fecha',e.enfoque]];for(const [name,text] of parts){if(!text)continue;const h=document.createElement('h3');h.textContent=name;const p=document.createElement('p');p.textContent=text;content.append(h,p)}el('detail').showModal()}
function renderFilters(){const root=el('filters');root.replaceChildren();for(const cat of CATS){const btn=document.createElement('button');btn.className='filter';btn.type='button';btn.textContent=cat;btn.setAttribute('aria-pressed',String(cat===activeCategory));btn.onclick=()=>{activeCategory=cat;renderFilters();render()};root.append(btn)}}
function renderMonth(){const [y,m]=activeMonth.split('-').map(Number);el('month').textContent=format(activeMonth+'-01',{month:'long',year:'numeric'});el('prev').disabled=MONTHS.indexOf(activeMonth)===0;el('next').disabled=MONTHS.indexOf(activeMonth)===MONTHS.length-1;const root=el('dates');root.replaceChildren();const offset=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;const last=new Date(Date.UTC(y,m,0)).getUTCDate();const monthEvents=EVENTS.filter(e=>e.tipo==='sesion'&&e.fecha.startsWith(activeMonth)&&matches(e));el('summary').textContent=monthEvents.length+' fechas visibles';const count=Math.ceil((offset+last)/7)*7;for(let i=0;i<count;i++){const d=i-offset+1;const cell=document.createElement('div');cell.className='day';if(d<1||d>last){cell.classList.add('blank');root.append(cell);continue}const date=activeMonth+'-'+String(d).padStart(2,'0');if(date===TODAY)cell.classList.add('current');if(date===MOBILE_TODAY)cell.classList.add('current-mobile');const num=document.createElement('div');num.className='num';const n=document.createElement('span');n.textContent=window.matchMedia('(max-width:620px)').matches?format(date,{day:'numeric',month:'long'}):d;num.append(n);cell.append(num);const e=monthEvents.find(x=>x.fecha===date);if(e){cell.classList.add('has-event');cell.setAttribute('role','button');cell.tabIndex=0;cell.setAttribute('aria-haspopup','dialog');cell.setAttribute('aria-label','Ver detalles del '+format(e.fecha,{day:'numeric',month:'long'})+': '+e.pilar+', '+e.titulo);cell.onclick=()=>openDetail(e);cell.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();openDetail(e)}};const event=document.createElement('div');event.className='event';const type=document.createElement('div');type.className='category';type.textContent=e.pilar||'Tema pendiente';const title=document.createElement('div');title.className='event-title';title.textContent=e.titulo;event.append(type,title);cell.append(event)}root.append(cell)}}
function renderResults(){const q=norm(el('search').value.trim());const results=EVENTS.filter(e=>e.tipo==='sesion'&&matches(e)&&norm([e.titulo,e.pilar,e.enfoque,e.herramientas].join(' ')).includes(q));const root=el('results');root.replaceChildren();el('summary').textContent=results.length+' resultados en todo el calendario';for(const e of results){const box=document.createElement('article');box.className='result';const time=document.createElement('time');time.dateTime=e.fecha;time.textContent=format(e.fecha,{weekday:'short',day:'numeric',month:'short',year:'numeric'});const h=document.createElement('h3');h.textContent=e.titulo;const btn=document.createElement('button');btn.type='button';btn.textContent='Ver enfoque y herramientas';btn.onclick=()=>openDetail(e);box.append(time,h,btn);root.append(box)}if(!results.length){const no=document.createElement('p');no.className='no-results';no.textContent='No se encontraron fechas con esa búsqueda.';root.append(no)}}
function render(){const search=Boolean(el('search').value.trim());el('calendar').style.display=search?'none':'';el('results').style.display=search?'grid':'none';el('month').textContent=format(activeMonth+'-01',{month:'long',year:'numeric'});if(search)renderResults();else renderMonth()}
el('prev').onclick=()=>{activeMonth=MONTHS[Math.max(MONTHS.indexOf(activeMonth)-1,0)];el('search').value='';render()};
el('next').onclick=()=>{activeMonth=MONTHS[Math.min(MONTHS.indexOf(activeMonth)+1,MONTHS.length-1)];el('search').value='';render()};
function scrollToMobileToday(){if(!window.matchMedia('(max-width:620px)').matches||activeMonth!==MOBILE_TODAY.slice(0,7))return;const current=el('dates').querySelector('.day.current-mobile');if(current)current.scrollIntoView({behavior:'auto',block:'start'});}
el('today').onclick=()=>{const focusDate=window.matchMedia('(max-width:620px)').matches?MOBILE_TODAY:TODAY;activeMonth=MONTHS.includes(focusDate.slice(0,7))?focusDate.slice(0,7):MONTHS[0];activeCategory='Todos';el('search').value='';renderFilters();render();window.requestAnimationFrame(scrollToMobileToday)};
el('search').addEventListener('input',render);el('close').onclick=()=>el('detail').close();el('detail').addEventListener('click',ev=>{if(ev.target===el('detail'))el('detail').close()});
el('session-count').textContent=EVENTS.filter(e=>e.tipo==='sesion').length;renderFilters();render();
// Al abrir en celular, situar la pantalla en la tarjeta de hoy SIN alterar el orden de las fechas.
window.addEventListener('load',scrollToMobileToday,{once:true});
window.matchMedia('(max-width:620px)').addEventListener('change',()=>render());
</script>
